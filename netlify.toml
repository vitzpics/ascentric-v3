# Netlify configuration for Ascentric website

[build]
  publish = "."

# Redirect www to non-www (update once domain is connected)
# [[redirects]]
#   from = "https://www.ascentric.io/*"
#   to   = "https://ascentric.io/:splat"
#   status = 301
#   force  = true

# Clean URLs — serve .html files without the extension
[[redirects]]
  from = "/about"
  to   = "/about.html"
  status = 200

[[redirects]]
  from = "/services"
  to   = "/services.html"
  status = 200

[[redirects]]
  from = "/culture-cartography"
  to   = "/culture-cartography.html"
  status = 200

[[redirects]]
  from = "/speaking"
  to   = "/speaking.html"
  status = 200

[[redirects]]
  from = "/contact"
  to   = "/contact.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
